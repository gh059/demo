<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>데이터베이스 테스트</title>
</head>
<body>
    <h1>User List</h1>
    
    <!-- 수정된 실습 코드 (테이블 헤더 및 나이, 성별 컬럼 추가) -->
    <table border="1">
        <!-- 테이블 헤더 추가 -->
        <tr>
            <th>아이디</th>
            <th>이름</th>
            <th>나이</th>
            <th>성별</th>
        </tr>
        <!-- th:each로 사용자 목록 반복 처리 -->
        <tr th:each="user : ${users}">
            <td th:text="${user.id}"></td>
            <td th:text="${user.name}"></td>
            <td th:text="${user.age}"></td>     <!-- 나이 추가 -->
            <td th:text="${user.gender}"></td> <!-- 성별 추가 -->
        </tr>
    </table>
</body>
</html>
